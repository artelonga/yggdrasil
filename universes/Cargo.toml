[workspace]
resolver = "2"
members = [
    "universe-sdk",
    "echo",
    "universe-snake",
    "universe-tetris",
    "universe-invaders",
    "universe-pointset",
    "universe-poker",
    "universe-vim",
]

# Campos herdados por crates que usam `*.workspace = true` (ex. universe-vim).
# Sua ausência quebrava o build WASM no CI (`failed to inherit edition`).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Deps herdadas por `serde = { workspace = true }` nas crates (ex. universe-vim).
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
