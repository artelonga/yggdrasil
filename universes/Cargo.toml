[workspace]
resolver = "2"
members = [
    "universe-sdk",
    "echo",
    "universe-snake",
    "universe-tetris",
    "universe-invaders",
    "universe-pointset",
    "universe-poker",
    "universe-vim",
    "universe-shandara",
]

# [workspace.package] removido em YG-64: cada crate de universo declara
# version/edition/license literalmente, para versionamento independente do core.
# (universe-vim deixou de usar `version.workspace = true`.)

# Deps herdadas por `serde = { workspace = true }` nas crates (ex. universe-vim).
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
