# REGISTRY.yaml — fonte da verdade do catálogo de universos do Yggdrasil.
#
# Declara TODAS as entradas do catálogo, não só os universos jogáveis:
#   - status: embedded → WASM/engine em produção, jogável aqui (playable: true)
#   - status: planned  → mapeado, sem código ainda (placeholder, contribuível)
#   - status: external → existe fora da plataforma, link out (saiba mais)
#
# Lido em compile-time por `yggdrasil-web/src/catalog.rs` via include_str! +
# serde_yaml. O schema está documentado em `docs/architecture/catalog.md`.
#
# Campos por entrada:
#   slug          (obrigatório) identificador único, kebab-case
#   status        (obrigatório) embedded | planned | external
#   type          (obrigatório) rpg | arcade | puzzle | atlas | lingua | ferramentas | mesa
#   title         (obrigatório) nome humano (PT-BR)
#   description   (obrigatório) descrição curta em PT-BR
#   genre         lista de gêneros (filtro multi)
#   origin        brazilian | international | original
#   license       open-source | commercial | MIT | "MIT AND CC-BY-SA-4.0" | ...
#   creators      lista de autores/criadores
#   year          ano de criação/publicação
#   external_url  link externo (obrigatório para status: external)
#   target_release versão do Yggdrasil em que planejamos portar (planned)
#   port_difficulty easy | medium | hard (chute inicial, confirmar com mantenedores)
#   versions_tracked true se o crate tem CHANGELOG próprio via git pathspec (YG-71)

