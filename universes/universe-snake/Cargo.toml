[package]
name = "universe-snake"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Snake WASM universe for Yggdrasil — grid 40×20, pure-Rust"

[lib]
crate-type = ["cdylib"]

[dependencies]
universe-sdk = { path = "../universe-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
