<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shandara — SRD</title>
  <meta name="description" content="Shandara — System Reference Document (CC-BY-SA). Mundo de fantasia regido por seis forças primordiais.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
    html, body { overflow-x: hidden; }
    :root { --gold:#d4af37; --ink:#e8e3d3; --dim:#a9a99a; --bg:#0f0d0b; --bg2:#1a1713; --line:#2b2620; --accent:#c98b3a; }
    body { background: radial-gradient(1200px 700px at 70% -10%, #1c1611, var(--bg)); color: var(--ink);
      font: 16px/1.6 Georgia, 'Iowan Old Style', serif; min-height: 100vh; }
    header { display: flex; align-items: baseline; gap: 1rem; padding: 1rem 1.4rem; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: rgba(15,13,11,.85); backdrop-filter: blur(8px); z-index: 10; }
    header h1 { font-style: italic; font-size: 1.3rem; color: var(--gold); letter-spacing: .02em; }
    header .lic { font-size: .72rem; color: var(--dim); }
    header .grow { flex: 1; }
    header a.back { color: var(--gold); text-decoration: none; font-size: .8rem; border: 1px solid var(--line); padding: .3rem .7rem; border-radius: 6px; font-family: system-ui; }
    .layout { display: flex; align-items: flex-start; max-width: 70rem; margin: 0 auto; }
    nav#toc { width: 17rem; flex: none; padding: 1.2rem 1rem; position: sticky; top: 64px; max-height: calc(100vh - 64px);
      overflow-y: auto; font-family: system-ui, sans-serif; }
    nav#toc .sec { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
      margin: 1rem 0 .3rem; }
    nav#toc a { display: block; color: var(--ink); text-decoration: none; font-size: .88rem; padding: .25rem .5rem;
      border-radius: 6px; opacity: .8; }
    nav#toc a:hover { background: var(--bg2); opacity: 1; }
    nav#toc a.on { color: var(--gold); background: var(--bg2); opacity: 1; }
    main { flex: 1; padding: 1.6rem 1.8rem 5rem; max-width: 46rem; }
    main h1 { font-style: italic; font-size: 2rem; color: var(--gold); margin: .3rem 0 1rem; }
    main h2 { font-size: 1.35rem; margin: 1.6rem 0 .5rem; color: var(--accent); }
    main h3 { font-size: 1.1rem; margin: 1.2rem 0 .4rem; }
    main p { margin: .7rem 0; }
    main ul, main ol { margin: .6rem 0 .6rem 1.4rem; }
    main li { margin: .2rem 0; }
    main strong { color: #f0e6cf; }
    main blockquote { border-left: 3px solid var(--accent); padding: .3rem 0 .3rem 1rem; margin: .8rem 0;
      color: var(--dim); font-style: italic; }
    main code { background: #07070b; padding: .05rem .35rem; border-radius: 4px; font-size: .85em; }
    main hr { border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0; }
    main a { color: var(--gold); }
    .empty { color: var(--dim); font-style: italic; }
    @media (max-width: 820px) { .layout { flex-direction: column; } nav#toc { width: 100%; position: static; max-height: none; border-bottom: 1px solid var(--line); } main { padding: 1.2rem; } }
  </style>
</head>
<body>
  <header>
    <h1>Shandara</h1>
    <span class="lic">SRD · CC-BY-SA 4.0</span>
    <span class="grow"></span>
    <a class="back" href="/universos">← universos</a>
  </header>
  <div class="layout">
    <nav id="toc"><p class="empty">carregando…</p></nav>
    <main id="doc"><p class="empty">Escolha uma seção.</p></main>
  </div>
  <script src="/static/universos/shandara.js"></script>
  <script defer src="/static/nav.js"></script>
  <script defer src="/static/telemetria.js"></script>
  <script defer src="/static/universos/atividade.js" data-universo="shandara"></script>
</body>
</html>
