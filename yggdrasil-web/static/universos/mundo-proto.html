<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo — protótipo (YG-146)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font: 14px/1.5 system-ui, sans-serif; background: #0b0b0f; color: #e8e3d3; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    /* top bar */
    header { display: flex; align-items: center; gap: 1rem; padding: .5rem .9rem; background: #14141c; border-bottom: 1px solid #262633; flex-wrap: wrap; }
    header h1 { font-size: .95rem; font-weight: 600; letter-spacing: .04em; color: #d4af37; }
    header h1 small { color: #6f6f7d; font-weight: 400; letter-spacing: 0; }
    #temas { display: flex; gap: .8rem; flex-wrap: wrap; }
    .fam { display: flex; align-items: center; gap: .3rem; }
    .fl { font-size: .72rem; color: #9a9aae; margin-right: .15rem; }
    .tbtn { font: inherit; font-size: .8rem; padding: .28rem .6rem; border: 1px solid #33334a; background: #1c1c28; color: #d8d8e4; border-radius: 7px; cursor: pointer; }
    .tbtn:hover { border-color: #4a4a6a; }
    .tbtn.on { background: #2a2a40; border-color: #6366f1; color: #fff; }
    header .grow { flex: 1; }
    #tema-nome { font-size: .78rem; color: #9a9aae; }
    #nova-pasta { font: inherit; font-size: .8rem; padding: .28rem .6rem; border: 1px solid #2f6f55; background: #15291f; color: #7fe0a8; border-radius: 7px; cursor: pointer; }
    #fb-btn { font: inherit; font-size: .8rem; padding: .28rem .6rem; border: 1px solid #6366f1; background: #1d1d33; color: #c4b5fd; border-radius: 7px; cursor: pointer; }
    /* layout */
    main { position: relative; display: grid; grid-template-columns: 50px 1fr 250px; min-height: 0; }
    /* barra de ferramentas do lobby (4 ícones à esquerda — nada acima do lobby) */
    #ferramentas { background: #0d0d14; border-right: 1px solid #262633; display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: .6rem 0; }
    .tool { width: 38px; height: 38px; font-size: 1.15rem; border: 1px solid #2a2a40; background: #16161f; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .tool:hover { border-color: #6366f1; background: #1c1c2c; }
    #npc-ab { font: inherit; font-size: .76rem; padding: .28rem .55rem; border: 1px solid #4a3a6a; background: #1d1830; color: #c4b5fd; border-radius: 7px; cursor: pointer; }
    #npc-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 15; font: inherit; font-size: .82rem; padding: .35rem .8rem; border: 1px solid #4a3a6a; background: rgba(29,24,48,.92); color: #c4b5fd; border-radius: 20px; cursor: pointer; backdrop-filter: blur(6px); }
    /* overlay (Kanban / Timeline) */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 40; }
    #overlay.open { display: flex; }
    .ov-card { width: min(860px, 94vw); max-height: 86vh; background: #14141c; border: 1px solid #33334a; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .ov-body { padding: 1rem; overflow: auto; }
    .ohint { margin-top: .8rem; font-size: .76rem; color: #8a8a9e; }
    .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; }
    .kcol { background: #0f0f17; border: 1px solid #24243a; border-radius: 9px; padding: .5rem; min-height: 120px; }
    .khead { font-size: .78rem; font-weight: 700; padding: .25rem .45rem; border-radius: 6px; margin-bottom: .5rem; display: flex; justify-content: space-between; }
    .kcard { background: #1b1b28; border: 1px solid #2c2c44; border-radius: 7px; padding: .45rem .55rem; margin-bottom: .45rem; font-size: .82rem; cursor: pointer; }
    .kcard:hover { border-color: #6366f1; }
    .kroom { display: block; font-size: .68rem; color: #7a7a90; margin-top: .15rem; }
    .kempty { color: #555; font-size: .8rem; text-align: center; padding: .5rem; }
    .tl { list-style: none; }
    .tl li { padding: .45rem .55rem; border-bottom: 1px solid #20202e; font-size: .85rem; cursor: pointer; }
    .tl li:hover { background: #1a1a26; }
    #stage { position: relative; min-width: 0; overflow: hidden; }
    #cv { width: 100%; height: 100%; display: block; cursor: pointer; }
    .help { position: absolute; left: 10px; bottom: 10px; font-size: .72rem; color: rgba(255,255,255,.55); background: rgba(0,0,0,.4); padding: .3rem .6rem; border-radius: 6px; pointer-events: none; }
    /* sidebar */
    aside { background: #101018; border-left: 1px solid #262633; padding: .7rem; overflow-y: auto; }
    #trilha { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem; margin-bottom: .7rem; }
    .crumb { font: inherit; font-size: .76rem; padding: .15rem .4rem; border: none; background: none; color: #9a9aae; cursor: pointer; border-radius: 5px; }
    .crumb.on { color: #d4af37; font-weight: 600; }
    .crumb:hover { background: #1c1c28; color: #fff; }
    .sep { color: #44445a; }
    .t-here { font-size: .8rem; color: #d4af37; margin-bottom: .3rem; }
    #arvore ul { list-style: none; }
    #arvore li { font-size: .8rem; padding: .22rem .4rem; border-radius: 5px; cursor: default; }
    #arvore li.t-folder { cursor: pointer; color: #cbd5e1; }
    #arvore li.t-folder:hover { background: #1c1c28; }
    .st { font-size: .62rem; padding: 0 .3rem; border-radius: 4px; vertical-align: middle; }
    .st.todo { background: #1e3a5f; color: #60a5fa; } .st.doing { background: #5f4a1e; color: #fbbf24; } .st.done { background: #1e4f3a; color: #34d399; }
    /* painel deslizante (nota/npc) */
    #panel { position: absolute; top: 0; right: 0; width: 340px; max-width: 90vw; height: 100%; background: #14141c; border-left: 1px solid #33334a; transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; z-index: 20; }
    #panel.open { transform: translateX(0); }
    .ph { display: flex; align-items: center; justify-content: space-between; padding: .7rem .9rem; border-bottom: 1px solid #262633; font-weight: 600; }
    .ph .x { background: none; border: none; color: #9a9aae; font-size: 1rem; cursor: pointer; }
    .pb { padding: .9rem; overflow-y: auto; flex: 1; }
    .pb h3 { color: #d4af37; margin: .2rem 0 .5rem; }
    .pb textarea { width: 100%; background: #0b0b0f; color: #e8e3d3; border: 1px solid #33334a; border-radius: 6px; padding: .5rem; font: inherit; }
    .pf { padding: .7rem .9rem; border-top: 1px solid #262633; display: flex; gap: .5rem; }
    .pf button { font: inherit; padding: .35rem .7rem; border: 1px solid #33334a; background: #1c1c28; color: #d8d8e4; border-radius: 6px; cursor: pointer; }
    .pf button.danger { border-color: #5f2330; color: #f08aa0; }
    .npc-msg { background: #1c1c28; border-radius: 8px; padding: .6rem .7rem; margin-bottom: .7rem; }
    .topics { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .7rem; }
    .topic { text-align: left; font: inherit; font-size: .8rem; padding: .4rem .6rem; border: 1px solid #2a2a40; background: #16161f; color: #cbd5e1; border-radius: 7px; cursor: pointer; }
    .topic:hover { border-color: #6366f1; }
    .ask { display: flex; gap: .4rem; }
    .ask input { flex: 1; background: #0b0b0f; color: #e8e3d3; border: 1px solid #33334a; border-radius: 6px; padding: .4rem; font: inherit; }
    .ask button { font: inherit; padding: .4rem .6rem; border: none; background: #6366f1; color: #fff; border-radius: 6px; cursor: pointer; }
    #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,.85); color: #fff; padding: .5rem .9rem; border-radius: 8px; font-size: .82rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* barra de dica A/B no editor (← → alterna variantes, como navegar tutorial) */
    .hintbar { display: flex; align-items: center; gap: .4rem; margin-top: .5rem; }
    .hintbar .hint { flex: 1; text-align: center; font-size: .74rem; color: #9aa6b8; background: #16161f; border: 1px solid #2a2a40; border-radius: 6px; padding: .3rem .4rem; }
    .hb-nav { font: inherit; border: 1px solid #2a2a40; background: #1c1c28; color: #cbd5e1; border-radius: 6px; padding: .15rem .5rem; cursor: pointer; }
    .hb-nav:hover { border-color: #6366f1; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } aside { display: none; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Mundo <small>· protótipo de temas</small></h1>
      <div id="temas"></div>
      <span class="grow"></span>
      <span id="tema-nome"></span>
      <button id="npc-ab" title="A/B: posição do NPC">NPC: lateral (A)</button>
      <button id="fb-btn" title="Enviar feedback (marca a versão/tema atual)">💬 Feedback</button>
      <button id="nova-pasta">+ nova sala</button>
    </header>
    <main>
      <nav id="ferramentas" title="Ferramentas do lobby"></nav>
      <div id="stage">
        <canvas id="cv"></canvas>
        <button id="npc-top" title="Guia (NPC) — sempre disponível">🧙 Guia</button>
        <div class="help">Caminhe com <b>WASD</b> ou <b>SETAS</b> (segure p/ acelerar, 2 teclas = diagonal) · <b>clique</b> · <b>parede</b>: ↑ entra · ↓ início · ←→ pasta irmã · pise em porta/nota · <b>arraste</b> p/ mover</div>
        <div id="toast"></div>
        <div id="panel"></div>
      </div>
      <aside>
        <div id="trilha"></div>
        <div id="arvore"></div>
      </aside>
    </main>
    <div id="overlay"></div>
  </div>
  <script defer src="/static/telemetria.js"></script>
  <script type="module" src="/static/universos/mundo/proto.js"></script>
</body>
</html>
