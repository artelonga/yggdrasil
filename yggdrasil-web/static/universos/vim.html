<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vim — Yggdrasil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d12;
      color: #e8e3d3;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }
    h1 { font-weight: 300; letter-spacing: 0.2em; font-size: 1.8rem; margin-bottom: 0.3rem; }
    .subtitulo { opacity: 0.5; font-size: 0.8rem; margin-bottom: 1rem; }

    .header-info {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      align-items: center;
    }
    .header-info .label { opacity: 0.6; }
    .header-info .value { color: #d4af37; font-size: 1.1rem; font-weight: bold; margin-left: 0.3rem; }

    .editor-wrap {
      position: relative;
      border: 1px solid #2a2a3e;
      background: #0a0a10;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .status-bar {
      background: #1a1a2e;
      color: #e8e3d3;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      padding: 2px 6px;
      min-height: 1.4em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-mode {
      font-weight: bold;
      padding: 0 4px;
    }
    .mode-NORMAL  { color: #34d399; }
    .mode-INSERT  { color: #60a5fa; }
    .mode-VISUAL  { color: #c084fc; }
    .mode-COMMAND { color: #fbbf24; }
    .mode-SEARCH  { color: #fbbf24; }

    .status-text { flex: 1; padding: 0 8px; color: #fbbf24; }
    .status-pos  { opacity: 0.5; font-size: 0.75rem; }

    .hint-box {
      margin-top: 0.8rem;
      max-width: 600px;
      background: #12121c;
      border: 1px solid #2a2a3e;
      border-left: 3px solid #d4af37;
      padding: 0.5rem 0.8rem;
      font-size: 0.82rem;
      color: #c9b97a;
      line-height: 1.5;
    }
    .hint-box .hint-label { color: #d4af37; font-weight: bold; margin-right: 0.4rem; }

    .nivel-completo {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 100;
    }
    .nivel-completo.ativo { display: flex; }
    .nivel-completo .box {
      background: #12121c;
      border: 2px solid #d4af37;
      padding: 2rem 3rem;
      text-align: center;
      max-width: 400px;
    }
    .nivel-completo h2 { color: #d4af37; font-weight: 300; letter-spacing: 0.15em; margin-bottom: 0.5rem; }
    .nivel-completo p  { opacity: 0.7; font-size: 0.9rem; }

    .rodape {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: #e8a030;
      min-height: 1.2em;
    }

    .lobby-link {
      margin-top: 1.2rem;
      font-size: 0.82rem;
      color: #5a5a8a;
    }
    .lobby-link a { color: #7a7aaa; text-decoration: none; }
    .lobby-link a:hover { color: #d4af37; }
  </style>
</head>
<body>
  <h1>⌨ VIM</h1>
  <p class="subtitulo">10 níveis para dominar o editor modal</p>

  <div class="header-info">
    <span><span class="label">Nível</span><span class="value" id="nivel">1</span><span class="label">/10</span></span>
    <span><span class="label">Pontuação</span><span class="value" id="score">0</span></span>
    <span><span class="label" id="nivel-titulo"></span></span>
  </div>

  <div class="editor-wrap">
    <canvas id="canvas" aria-label="Editor Vim"></canvas>
    <div class="status-bar">
      <span class="status-mode mode-NORMAL" id="mode-label">NORMAL</span>
      <span class="status-text" id="status-text"></span>
      <span class="status-pos" id="status-pos">1,1</span>
    </div>
  </div>

  <div class="hint-box" id="hint-box">
    <span class="hint-label">Dica:</span><span id="hint-text"></span>
  </div>

  <p id="rodape" class="rodape" aria-live="polite"></p>

  <div class="nivel-completo" id="nivel-completo">
    <div class="box">
      <h2 id="nc-titulo">NÍVEL COMPLETO!</h2>
      <p id="nc-msg">Avançando para o próximo nível…</p>
    </div>
  </div>

  <div class="lobby-link"><a href="/lobby">← Voltar ao Lobby</a></div>

  <script src="/static/universos/vim.js"></script>
  <script defer src="/static/feedback.js"></script>
</body>
</html>
