<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo do CO — importar/navegar/editar (YG-153)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font: 14px/1.5 system-ui, sans-serif; background: #0b0b0f; color: #e8e3d3; }
    #app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
    header { display: flex; align-items: center; gap: 1rem; padding: .5rem .9rem; background: #14141c; border-bottom: 1px solid #262633; flex-wrap: wrap; }
    header h1 { font-size: .95rem; font-weight: 600; color: #6cf; }
    #temas { display: flex; gap: .4rem; flex-wrap: wrap; }
    .tbtn { font: inherit; font-size: .78rem; padding: .25rem .55rem; border: 1px solid #33334a; background: #1c1c28; color: #d8d8e4; border-radius: 7px; cursor: pointer; }
    .tbtn.on { background: #2a2a40; border-color: #6366f1; color: #fff; }
    #hud { font-size: .78rem; color: #9a9aae; }
    .locbtn { font: inherit; font-size: .74rem; padding: .15rem .45rem; border: 1px solid #33334a; background: #16161f; color: #b9b9c8; border-radius: 6px; cursor: pointer; }
    .locbtn.on { border-color: #6cf; color: #cfe8ff; background: #14202c; }
    #trilha { padding: .35rem .9rem; background: #101018; border-bottom: 1px solid #262633; font-size: .8rem; color: #9a9aae; }
    .crumb { font: inherit; font-size: .8rem; border: none; background: none; color: #9a9aae; cursor: pointer; }
    .crumb.on { color: #6cf; font-weight: 600; }
    #stage { position: relative; min-height: 0; overflow: hidden; }
    #cv { width: 100%; height: 100%; display: block; cursor: pointer; }
    .help { position: absolute; left: 10px; bottom: 10px; font-size: .72rem; color: rgba(255,255,255,.5); background: rgba(0,0,0,.4); padding: .3rem .6rem; border-radius: 6px; pointer-events: none; }
    #panel { position: absolute; top: 0; right: 0; width: 360px; max-width: 92vw; height: 100%; background: #14141c; border-left: 1px solid #33334a; transform: translateX(105%); transition: transform .18s; display: flex; flex-direction: column; z-index: 20; }
    #panel.open { transform: translateX(0); }
    .ph { display: flex; justify-content: space-between; align-items: center; padding: .7rem .9rem; border-bottom: 1px solid #262633; font-weight: 600; }
    .ph .x { background: none; border: none; color: #9a9aae; font-size: 1rem; cursor: pointer; }
    .pb { padding: .9rem; overflow: auto; flex: 1; }
    .pb h3 { color: #6cf; margin: .3rem 0 .4rem; }
    .pb textarea { width: 100%; background: #0b0b0f; color: #e8e3d3; border: 1px solid #33334a; border-radius: 6px; padding: .5rem; font: inherit; }
    .pf { padding: .7rem .9rem; border-top: 1px solid #262633; display: flex; gap: .6rem; align-items: center; }
    .pf button { font: inherit; padding: .35rem .8rem; border: 1px solid #33334a; background: #1c1c28; color: #d8d8e4; border-radius: 6px; cursor: pointer; }
    .dim { color: #8a8a9e; font-size: .82rem; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🌐 Mundo do CO</h1>
      <div id="temas"></div>
      <span style="flex:1"></span>
      <span id="locales" class="dim" style="display:flex;gap:.3rem;align-items:center"></span>
      <span id="hud" class="dim">carregando…</span>
    </header>
    <div id="trilha"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="help">WASD/setas/clique p/ andar · porta=sala · nota=abrir (lê do CO) · editar grava de volta no CO</div>
      <div id="panel"></div>
    </div>
  </div>
  <script type="module" src="/static/universos/co-mundo.js"></script>
</body>
</html>
