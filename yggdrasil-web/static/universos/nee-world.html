<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ÑE'Ẽ Mundo — sala caminhável de léxico</title>
  <style>
    :root {
      --bg: #0b0d14; --ink: #e8e3d3; --dim: #9a937f; --gold: #d4af37;
      --panel: #151723; --line: #2a2c3a; --note: #5b8def; --chord: #c77dff;
      --motif: #4caf72; --word: #f0a35e; --scale: #a8d8ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    #header { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: rgba(11,13,20,.85); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); }
    #header a { color: var(--gold); text-decoration: none; font-size: .85rem; }
    #pack-title { font-size: .95rem; font-weight: 600; color: var(--ink); }
    #log { font-size: .72rem; color: var(--dim); margin-left: auto; }

    /* canvas ocupa o espaço restante abaixo do header */
    #stage { position: fixed; top: 40px; left: 0; right: 0; bottom: 0; }
    #cv { display: block; width: 100%; height: 100%; }

    /* inspector flutuante no canto inferior direito */
    #inspector { position: fixed; bottom: 20px; right: 20px; z-index: 20;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; min-width: 220px; max-width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,.5); }
    #inspector[hidden] { display: none; }
    #ins-header { display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; }
    #ins-role { font-size: .7rem; color: var(--dim); text-transform: uppercase;
      letter-spacing: .05em; }
    #ins-close { background: none; border: none; color: var(--dim); cursor: pointer;
      font-size: 1rem; line-height: 1; padding: 0 2px; }
    #ins-close:hover { color: var(--ink); }
    #ins-term { font-size: 1.15rem; font-weight: 700; color: var(--gold);
      margin-bottom: 6px; }
    #ins-gloss { font-size: .85rem; color: var(--ink); line-height: 1.45;
      margin-bottom: 8px; }
    #ins-relations { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
    #ins-relations[hidden] { display: none; }
    #ins-relations h3 { font-size: .72rem; text-transform: uppercase; color: var(--dim);
      letter-spacing: .05em; margin-bottom: 6px; }
    #ins-rel-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    button.rel-link { background: none; border: 1px solid var(--line); color: var(--note);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: .8rem;
      text-align: left; width: 100%; transition: border-color .12s ease; }
    button.rel-link:hover { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>
  <div id="header">
    <a href="/universos/nee">← ÑE'Ẽ</a>
    <span id="pack-title"></span>
    <span id="log"></span>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
  </div>

  <aside id="inspector" hidden>
    <div id="ins-header">
      <span id="ins-role"></span>
      <button id="ins-close" title="fechar">✕</button>
    </div>
    <div id="ins-term"></div>
    <div id="ins-gloss"></div>
    <section id="ins-relations" hidden>
      <h3>Relações</h3>
      <ul id="ins-rel-list"></ul>
    </section>
  </aside>

  <script type="module" src="/static/universos/nee-world.js"></script>
</body>
</html>
