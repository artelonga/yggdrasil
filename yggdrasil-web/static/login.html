<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Yggdrasil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1c1b1b;
      color: #e5e2e1;
      font-family: system-ui, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    h1 { font-weight: 300; letter-spacing: 0.2em; font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitulo { opacity: 0.5; font-size: 0.9rem; margin-bottom: 2.5rem; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 22rem;
    }
    label { font-size: 0.85rem; opacity: 0.7; letter-spacing: 0.1em; }
    input {
      background: #201f1f;
      border: 1px solid #2a2a3e;
      color: #e5e2e1;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      letter-spacing: 0.05em;
    }
    input:focus { border-color: #e9c349; }
    button {
      background: #e9c349;
      border: none;
      color: #1c1b1b;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .erro {
      color: #ff6b6b;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: -0.5rem;
    }
    .info {
      color: #e9c349;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      opacity: 0.8;
    }
    .btn-co {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      max-width: 22rem;
      background: #ffffff;
      color: #201f1f;
      padding: 0.7rem 1rem;
      text-align: center;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid #2a2a3e;
      margin-bottom: 1.2rem;
      transition: box-shadow 0.15s;
    }
    .btn-co:hover { box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.4); }
    .btn-co svg { flex-shrink: 0; }
    .separator {
      font-size: 0.75rem;
      opacity: 0.4;
      letter-spacing: 0.2em;
      margin-bottom: 1.2rem;
    }
    .link-volta {
      margin-top: 2rem;
      font-size: 0.85rem;
    }
    .link-volta a { color: #e9c349; text-decoration: none; border-bottom: 1px solid currentColor; }
    .hidden { display: none; }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Manrope:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui/relic.css">
<style>/* relic theme normalization */
body{font-family:'Manrope',system-ui,sans-serif}
h1,h2,h3{font-family:'Newsreader',Georgia,serif}</style>
</head>
<body>
  <h1>YGGDRASIL</h1>
  <p class="subtitulo">Conectando ideias. Construindo universos.</p>

  <a id="btn-co-login" class="btn-co" href="/auth/co-login">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continuar com Google
  </a>
  <p class="separator">— ou —</p>

  <form id="form-email">
    <label for="email">EMAIL</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="você@exemplo.com">
    <button type="submit" id="btn-email">Enviar código</button>
    <p class="erro" id="erro-email"></p>
  </form>

  <form id="form-codigo" class="hidden">
    <p class="info">Enviamos um código de 6 dígitos para <span id="email-confirmado"></span></p>
    <label for="codigo">CÓDIGO</label>
    <input type="text" id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
    <button type="submit" id="btn-codigo">Entrar</button>
    <p class="erro" id="erro-codigo"></p>
  </form>

  <p class="link-volta"><a href="/lobby">← Voltar ao lobby</a></p>

  <script src="/static/login.js"></script>
  <script defer src="/static/telemetria.js"></script>
</body>
</html>
