<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Yggdrasil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d12;
      color: #e8e3d3;
      font-family: system-ui, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    h1 { font-weight: 300; letter-spacing: 0.2em; font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitulo { opacity: 0.5; font-size: 0.9rem; margin-bottom: 2.5rem; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 22rem;
    }
    label { font-size: 0.85rem; opacity: 0.7; letter-spacing: 0.1em; }
    input {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      color: #e8e3d3;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      letter-spacing: 0.05em;
    }
    input:focus { border-color: #d4af37; }
    button {
      background: #d4af37;
      border: none;
      color: #0d0d12;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .erro {
      color: #ff6b6b;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: -0.5rem;
    }
    .info {
      color: #d4af37;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      opacity: 0.8;
    }
    .btn-co {
      display: inline-block;
      width: 100%;
      max-width: 22rem;
      background: #d4af37;
      color: #0d0d12;
      padding: 0.8rem 1rem;
      text-align: center;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
    }
    .btn-co:hover { opacity: 0.85; }
    .separator {
      font-size: 0.75rem;
      opacity: 0.4;
      letter-spacing: 0.2em;
      margin-bottom: 1.2rem;
    }
    .link-volta {
      margin-top: 2rem;
      font-size: 0.85rem;
    }
    .link-volta a { color: #d4af37; text-decoration: none; border-bottom: 1px solid currentColor; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>YGGDRASIL</h1>
  <p class="subtitulo">Conectando ideias. Construindo universos.</p>

  <a id="btn-co-login" class="btn-co" href="/auth/co-login">Entrar com CO</a>
  <p class="separator">— ou —</p>

  <form id="form-email">
    <label for="email">EMAIL</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="você@exemplo.com">
    <button type="submit" id="btn-email">Enviar código</button>
    <p class="erro" id="erro-email"></p>
  </form>

  <form id="form-codigo" class="hidden">
    <p class="info">Enviamos um código de 6 dígitos para <span id="email-confirmado"></span></p>
    <label for="codigo">CÓDIGO</label>
    <input type="text" id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
    <button type="submit" id="btn-codigo">Entrar</button>
    <p class="erro" id="erro-codigo"></p>
  </form>

  <p class="link-volta"><a href="/lobby">← Voltar ao lobby</a></p>

  <script src="/static/login.js"></script>
</body>
</html>
