<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yggdrasil — Lobby</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d12;
      color: #e8e3d3;
      font-family: system-ui, monospace;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .top-bar {
      max-width: 64rem;
      margin: 0 auto 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .top-bar h1 {
      font-weight: 300;
      letter-spacing: 0.2em;
      font-size: 1.8rem;
    }
    .auth-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
    }
    .auth-area a, .auth-area button {
      background: none;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 0.4rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-area a:hover, .auth-area button:hover { background: rgba(212, 175, 55, 0.1); }
    .auth-user { opacity: 0.7; }
    .layout {
      max-width: 64rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 18rem;
      gap: 2rem;
    }
    @media (max-width: 48rem) {
      .layout { grid-template-columns: 1fr; }
    }
    .lobby-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .subtitulo {
      opacity: 0.5;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 1px solid #1a1a2e;
      cursor: pointer;
    }
    .legenda {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      opacity: 0.75;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .rodape {
      min-height: 1.4em;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #e8a030;
      letter-spacing: 0.03em;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .panel {
      border: 1px solid #1a1a2e;
      background: #14141e;
      padding: 1rem;
    }
    .panel h2 {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #d4af37;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid #2a2a3e;
      padding-bottom: 0.5rem;
    }
    .panel .empty {
      font-size: 0.8rem;
      opacity: 0.4;
      text-align: center;
      padding: 0.5rem 0;
    }
    .score-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.8rem;
      padding: 0.25rem 0;
    }
    .score-row .game { width: 4.5rem; opacity: 0.6; font-size: 0.7rem; letter-spacing: 0.1em; }
    .score-row .user { flex: 1; opacity: 0.85; word-break: break-all; }
    .score-row .score { color: #d4af37; font-weight: 500; }
    .group-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      opacity: 0.5;
      margin-top: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .group-label:first-child { margin-top: 0; }
    .ts {
      font-size: 0.65rem;
      opacity: 0.4;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>YGGDRASIL</h1>
    <div id="auth-area" class="auth-area"></div>
  </div>

  <div class="layout">
    <div class="lobby-col">
      <p class="subtitulo">
        Cada jogo é um universo. Caminhe até um portal e entre.<br>
        <span style="opacity: 0.6; font-size: 0.75rem;">Em breve: criar o seu universo.</span>
      </p>
      <canvas id="canvas" aria-label="Mapa do lobby"></canvas>
      <p class="legenda">🐍 Snake &nbsp;·&nbsp; 🟦 Tetris &nbsp;·&nbsp; 👾 Invaders &nbsp;·&nbsp; 🃏 Poker</p>
      <p id="rodape" class="rodape" aria-live="polite"></p>
    </div>

    <aside class="sidebar">
      <section class="panel" id="panel-scores">
        <h2>HIGH SCORES</h2>
        <div id="scores-content" class="empty">Carregando…</div>
      </section>

      <section class="panel" id="panel-activity">
        <h2>ATIVIDADE RECENTE</h2>
        <div id="activity-content" class="empty">Carregando…</div>
      </section>

      <section class="panel" id="panel-reviews">
        <h2>REVIEWS</h2>
        <div class="empty">Sistema de reviews em breve.<br>Cada universo poderá ser avaliado.</div>
      </section>
    </aside>
  </div>

  <script src="/static/lobby.js"></script>
</body>
</html>
