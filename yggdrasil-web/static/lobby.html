<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yggdrasil — Lobby</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d12;
      color: #e8e3d3;
      font-family: system-ui, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    h1 {
      font-weight: 300;
      letter-spacing: 0.2em;
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
    }
    .subtitulo {
      opacity: 0.5;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 1px solid #1a1a2e;
      cursor: pointer;
    }
    .legenda {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      opacity: 0.75;
      letter-spacing: 0.05em;
    }
    .rodape {
      min-height: 1.4em;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #e8a030;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <h1>YGGDRASIL</h1>
  <p class="subtitulo">Cada jogo é um universo. Caminhe até um portal e entre.</p>
  <canvas id="canvas" aria-label="Mapa do lobby"></canvas>
  <p class="legenda">🐍 Snake &nbsp;·&nbsp; 🟦 Tetris &nbsp;·&nbsp; 👾 Invaders &nbsp;·&nbsp; 🃏 Poker</p>
  <p class="legenda" style="opacity: 0.4; font-size: 0.78rem; margin-top: 0.4rem;">
    Em breve: criar o seu universo.
  </p>
  <p id="rodape" class="rodape" aria-live="polite"></p>
  <script src="/static/lobby.js"></script>
</body>
</html>
