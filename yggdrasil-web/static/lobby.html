<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yggdrasil — Lobby</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1c1b1b;
      color: #e5e2e1;
      font-family: system-ui, monospace;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .top-bar {
      max-width: 76rem;
      margin: 0 auto 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .top-bar h1 {
      font-weight: 300;
      letter-spacing: 0.2em;
      font-size: 1.8rem;
    }
    .auth-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
    }
    .auth-area a, .auth-area button {
      background: none;
      border: 1px solid #e9c349;
      color: #e9c349;
      padding: 0.4rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-area a:hover, .auth-area button:hover { background: rgba(212, 175, 55, 0.1); }
    .auth-user { opacity: 0.7; }
    .layout {
      max-width: 76rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 18rem;
      gap: 2rem;
    }
    @media (max-width: 48rem) {
      .layout { grid-template-columns: 1fr; }
    }
    .lobby-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .subtitulo {
      opacity: 0.5;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 1px solid #201f1f;
      cursor: pointer;
    }
    .legenda {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      opacity: 0.75;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .rodape {
      min-height: 1.4em;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #e8a030;
      letter-spacing: 0.03em;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .panel {
      border: 1px solid #201f1f;
      background: #14141e;
      padding: 1rem;
    }
    .panel h2 {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #e9c349;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid #2a2a3e;
      padding-bottom: 0.5rem;
    }
    .panel .empty {
      font-size: 0.8rem;
      opacity: 0.4;
      text-align: center;
      padding: 0.5rem 0;
    }
    .score-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.8rem;
      padding: 0.25rem 0;
    }
    .score-row .game { width: 4.5rem; opacity: 0.6; font-size: 0.7rem; letter-spacing: 0.1em; }
    .score-row .user { flex: 1; opacity: 0.85; word-break: break-all; }
    .score-row .score { color: #e9c349; font-weight: 500; }
    .group-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      opacity: 0.5;
      margin-top: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .group-label:first-child { margin-top: 0; }
    .ts {
      font-size: 0.65rem;
      opacity: 0.4;
      margin-left: auto;
    }
    /* Universos — chips clicáveis (substitui a legenda estática) */
    .universos {
      margin-top: 1.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      max-width: 44rem;
    }
    .universo-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      border: 1px solid #2a2a3e;
      background: #14141e;
      color: #e5e2e1;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .universo-chip:hover { border-color: #e9c349; background: #1a1a26; }
    .universo-chip .ico { flex: 0 0 auto; }
    /* Painéis colapsáveis (details/summary nativo) */
    details.panel { padding: 0; }
    details.panel > summary {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #e9c349;
      padding: 0.8rem 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    details.panel > summary::before {
      content: '▸';
      font-size: 0.7rem;
      transition: transform 0.15s;
    }
    details.panel[open] > summary::before { transform: rotate(90deg); }
    details.panel > summary:hover { color: #f0d77a; }
    details.panel > .body { padding: 0 1rem 1rem; }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Manrope:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/ui/relic.css">
<style>/* relic theme normalization */
body{font-family:'Manrope',system-ui,sans-serif}
h1,h2,h3{font-family:'Newsreader',Georgia,serif}</style>
</head>
<body>
  <div class="top-bar">
    <h1>YGGDRASIL</h1>
    <div id="auth-area" class="auth-area"></div>
  </div>

  <div class="layout">
    <div class="lobby-col">
      <p class="subtitulo">
        Cada jogo é um universo. Caminhe até um portal e entre.<br>
        <span style="opacity: 0.6; font-size: 0.75rem;">Em breve: criar o seu universo.</span>
      </p>
      <canvas id="canvas" aria-label="Mapa do lobby"></canvas>
      <nav id="universos" class="universos" aria-label="Universos"></nav>
      <p id="rodape" class="rodape" aria-live="polite"></p>
    </div>

    <aside class="sidebar">
      <details class="panel" id="panel-scores">
        <summary>HIGH SCORES</summary>
        <div class="body"><div id="scores-content" class="empty">Carregando…</div></div>
      </details>

      <details class="panel" id="panel-activity">
        <summary>ATIVIDADE RECENTE</summary>
        <div class="body"><div id="activity-content" class="empty">Carregando…</div></div>
      </details>

      <details class="panel" id="panel-reviews">
        <summary>REVIEWS</summary>
        <div class="body"><div class="empty">Sistema de reviews em breve.<br>Cada universo poderá ser avaliado.</div></div>
      </details>
    </aside>
  </div>

  <script src="/static/lobby.js"></script>
  <script defer src="/static/nav.js"></script>
  <script defer src="/static/feedback.js"></script>
  <script defer src="/static/telemetria.js"></script>
</body>
</html>
