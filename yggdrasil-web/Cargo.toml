[package]
name = "yggdrasil-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yggdrasil — servidor HTTP, lobby renderizado em <canvas>, API pública"
publish = false

[[bin]]
name = "yggdrasil-web"
path = "src/main.rs"

[dependencies]
yggdrasil-core = { path = "../yggdrasil-core" }
game-core = { workspace = true }
universe-vim = { path = "../universes/universe-vim" }

axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

jsonwebtoken = { workspace = true }
argon2 = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
uuid = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

rusqlite = { workspace = true }

lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "builder",
] }

# YG-N: fetch CO's JWKS for cross-apex SSO. Uses rustls-tls-native-roots to
# avoid bringing in openssl alongside lettre's rustls.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
] }
tokio-util = "0.7"
wasmtime = { version = "44.0.1", features = ["cranelift"] }
dashmap = { workspace = true }

utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wat = "1"
