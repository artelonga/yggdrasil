[package]
name = "yggdrasil-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yggdrasil — servidor HTTP, lobby renderizado em <canvas>, API pública"
publish = false

[[bin]]
name = "yggdrasil-web"
path = "src/main.rs"

[dependencies]
yggdrasil-core = { path = "../yggdrasil-core" }
game-core = { workspace = true }
universe-vim = { path = "../universes/universe-vim" }

axum = { workspace = true, features = ["ws", "multipart"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

jsonwebtoken = { workspace = true }
argon2 = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
uuid = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

rusqlite = { workspace = true }
# YG-139: motor de análise de corpus (frequência + joins cross-linguísticos).
# `bundled` compila o DuckDB do source (precisa de g++, já presente no builder).
duckdb = { version = "1.1", features = ["bundled"] }
# YG-144: SRD do Shandara embutido no binário (deploy-safe — sem path em runtime,
# como o REGISTRY.yaml via include_str). Conteúdo canônico em universe-shandara.
include_dir = "0.7"

lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "builder",
] }

# YG-N: fetch CO's JWKS for cross-apex SSO. Uses rustls-tls-native-roots to
# avoid bringing in openssl alongside lettre's rustls.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# YG-93: cliente WS outbound do producer da federated bus do CO (dial ao hub
# CO-384). TLS via rustls (alinhado com o reqwest de auth_co.rs, sem openssl).
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
wasmtime = { version = "44.0.1", features = ["cranelift"] }
dashmap = { workspace = true }
sha2 = { workspace = true }

utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wat = "1"
tokio = { workspace = true, features = ["test-util"] }
