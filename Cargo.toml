[workspace]
resolver = "2"
members = [
    "yggdrasil-core",
    "yggdrasil-web",
]

[workspace.package]
version = "2.8.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/artelonga/yggdrasil"
description = "Yggdrasil — plataforma viva de criação, organização e conexão de universos digitais"
publish = false

[workspace.dependencies]
# Engine importado do co — git rev pinado (YG-38/YG-104): destrava o CI (que só faz
# checkout do yggdrasil; `../co/game-core` não existe lá). rev = co origin/main em
# 2026-06-07 (mesmo código do checkout local `../co/game-core`, sem drift). co é público.
game-core = { git = "https://github.com/artelonga/co", rev = "51faac00b13d11c0ea9addd6881f8748a10a12bc" }

# Web
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
hyper = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Auth (alinhado com co-web/src/auth.rs)
jsonwebtoken = "9"
argon2 = "0.5"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
nanoid = "0.4"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Concurrent collections
dashmap = "6"

# Testing
tempfile = "3"
