name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, target dirs, and wasm-opt binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-opt
            target/
            universes/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-opt
        run: cargo install wasm-opt --locked

      - name: Build universe WASM crates
        run: bash scripts/build-universes.sh

      - name: Build workspace
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: E2E — editor de universos (servidor real + auth real)
        run: YGGDRASIL_WEB_BIN=target/release/yggdrasil-web bash scripts/e2e-editor.sh

  godot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: yggdrasil-godot/.godot-bin
          key: godot-4.5-stable-${{ runner.os }}

      - name: Provision Godot 4.5 headless
        run: yggdrasil-godot/scripts/godot.sh install

      - name: Validate GDScript (headless lint)
        run: yggdrasil-godot/scripts/godot.sh check
