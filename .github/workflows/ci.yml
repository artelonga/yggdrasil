name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # game-core (git-pinado, YG-104) tem build.rs que compila protobuf → exige protoc.
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and target dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
            universes/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # WASM v1.0 reparado (YG-104): as crates universes/universe-* voltaram a
      # compilar para wasm32 contra a API atual do universe-sdk (Universe trait +
      # random_seed/kv_load/kv_store). build-universes.sh usa wasm-opt para otimizar
      # e validar os budgets de tamanho.
      - name: Install wasm-opt
        run: cargo install wasm-opt --locked

      - name: Build universe WASM crates
        run: bash scripts/build-universes.sh

      - name: Build workspace
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: E2E — editor de universos (servidor real + auth real)
        run: YGGDRASIL_WEB_BIN=target/release/yggdrasil-web bash scripts/e2e-editor.sh

  # NÃO-bloqueante (decisão do spike YG-35, docs/adr/YG-35-godot-vs-canvas.md): os
  # jogos 2D Godot (poker/snake/tetris) com erros de parse (GameBase/Card/HandEvaluator)
  # foram **descopados** — o canvas é o cliente de produção; Godot só para o anatomy3d.
  # Lint roda e reporta, mas não gateia o CI (não vale consertar GDScript descopado).
  godot:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: yggdrasil-godot/.godot-bin
          key: godot-4.5-stable-${{ runner.os }}

      - name: Provision Godot 4.5 headless
        run: yggdrasil-godot/scripts/godot.sh install

      - name: Validate GDScript (headless lint)
        run: yggdrasil-godot/scripts/godot.sh check
